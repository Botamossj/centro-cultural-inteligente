# =====================================================================
# Nginx como API Gateway / Reverse Proxy del Centro Cultural Inteligente
# - Sirve el frontend estático (HTML/CSS/JS).
# - Enruta /api/ hacia el backend Flask+Gunicorn.
# - Único servicio que publica un puerto público (80).
# - Frontend y API comparten origen => no hace falta CORS.
# =====================================================================

user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Oculta la versión de Nginx en cabeceras y páginas de error.
    server_tokens off;

    # Backend interno (resuelto por el DNS de Docker en la red interna).
    upstream backend_api {
        server backend:5000;
    }

    server {
        listen 80;
        server_name _;

        # Límite del tamaño del cuerpo JSON aceptado.
        client_max_body_size 1m;

        root /usr/share/nginx/html;
        index index.html;

        # --- Cabeceras de seguridad básicas ---
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # --- Health check propio de Nginx (para el healthcheck de Docker) ---
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "nginx-ok\n";
        }

        # --- Proxy de la API hacia el backend Flask ---
        location /api/ {
            proxy_pass http://backend_api;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # --- Frontend estático (SPA sencilla) ---
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
