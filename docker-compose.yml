# =====================================================================
# Orquestación del Centro Cultural Inteligente
# Servicios: database (PostgreSQL) -> backend (Flask/Gunicorn) -> nginx
# Redes: public_network (expuesta vía Nginx) / private_network (interna)
# Persistencia: bind mount del host (AWS EBS en producción)
# =====================================================================

services:
  # -------------------- Base de datos PostgreSQL --------------------
  database:
    image: postgres:16-alpine
    container_name: centro-cultural-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Persistencia física en el host (EBS en EC2). Sobrevive a `down`.
      - ${POSTGRES_DATA_PATH:-./postgres-data}:/var/lib/postgresql/data
      # Script de inicialización (solo se ejecuta con datadir vacío).
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - private_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    # NO se publica el puerto 5432: la base de datos no es accesible desde el host.

  # -------------------- Backend Flask + Gunicorn --------------------
  backend:
    build:
      context: ./backend
    container_name: centro-cultural-backend
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-database}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_ENV: ${APP_ENV:-production}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - private_network
      - public_network
    security_opt:
      - no-new-privileges:true
    # NO se publica el puerto 5000: solo Nginx accede al backend.

  # -------------------- Nginx (API Gateway) --------------------
  nginx:
    image: nginx:alpine
    container_name: centro-cultural-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # Configuración y estáticos en solo lectura (hardening).
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - public_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

networks:
  public_network:
    driver: bridge
  private_network:
    driver: bridge
    # Red interna: sin acceso al exterior. PostgreSQL queda aislada.
    internal: true
